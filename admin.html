<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050611">
<link rel="manifest" href="/manifest-admin.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>CHECKER</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="v"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/common.js"></script>
<script>
const V = $("v");
let P = null, view = "home", S = { shot: null, rep: [null, null], hist: false }, sub = false;

async function boot() {
  P = await me();
  if (!P) return loginView(V, "", boot);
  if (P.role != "admin") { await SB.auth.signOut(); P = null; return loginView(V, "Rahbar bo‘lsangiz /manager sahifasidan kiring.", boot); }
  if (!P.profile_done) return profile();
  if (!sub) { sub = true; SB.channel("m").on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, () => { if (view == "msgs" && document.activeElement.id != "mi") msgs(); else if (view == "home") home(); }).subscribe(); }
  go("home");
}
function profile() {
  V.innerHTML = '<div class="c" style="margin:20px 0">' + LOGO + '<h2 style="margin-top:12px">Profil ma’lumotlari</h2><p class="m">Birinchi kirishda bir marta to‘ldiriladi.</p></div>' +
    '<div class="f"><input id="a" placeholder="Ism"></div><div class="f"><input id="b" placeholder="Familiya"></div><div class="f"><input id="c" placeholder="BTP qisqa nomi"></div><div class="msg" id="err"></div><button class="btn" id="sv">Kirish</button>';
  $("sv").onclick = async () => {
    const a = $("a").value.trim(), b = $("b").value.trim(), c = $("c").value.trim();
    if (!a || !b || !c) { $("err").style.display = "block"; $("err").textContent = "Barcha maydonlarni to‘ldiring."; return; }
    const { error } = await SB.from("profiles").update({ first_name: a, last_name: b, btp: c, profile_done: true }).eq("id", P.id);
    if (error) return toast(error.message);
    boot();
  };
}
async function go(v) { view = v; V.innerHTML = ""; await ({ home, times, gen, rep, msgs, settings })[v](); window.scrollTo(0, 0); }
const back = t => '<div class="top"><button class="ib" onclick="go(\'home\')" aria-label="orqaga">‹</button><h2>' + t + '</h2></div>';
const tile = (v, t, d, n, p) => '<button class="tile glass t' + n + '" onclick="go(\'' + v + '\')"><span class="ic g' + n + '">' + IC(p) + '</span><span><b>' + t + '</b><span class="m">' + d + '</span></span></button>';

async function home() {
  const { count } = await SB.from("messages").select("id", { count: "exact", head: true }).eq("admin_id", P.id).neq("sender_id", P.id).is("read_at", null);
  V.innerHTML = '<div class="top">' + LOGO + '<div style="flex:1"><b class="brand">CHECKER</b><div class="m">' + esc(P.first_name + " " + P.last_name) + ' · ' + esc(P.btp) + '</div></div></div>' +
    '<h2 style="margin:6px 0 18px">Salom, ' + esc(P.first_name) + '!</h2>' +
    tile("times", "VAQTLARI", "Ishga kelish va ketish nazorati", 1, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>') +
    tile("gen", "GENUBORKA", "Tozalash jarayoni", 2, '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>') +
    tile("rep", "OTCHYOT", "Kunlik hisobotlar", 3, '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>') +
    '<button class="btn ghost" onclick="go(\'settings\')">Sozlamalar</button>' +
    '<button class="bell" onclick="go(\'msgs\')" aria-label="xabarlar">' + IC('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4"/>') + (count ? '<i class="bd">' + count + '</i>' : "") + '</button>';
}

/* ---- VAQTLARI ---- */
const stt = r => (r.kind == "in" ? "Keldi " : "Ketdi ") + tm(r.at) + " · " + lab(r);
function tick() { const e = $("ck"); if (!e) return; e.textContent = new Date().toLocaleTimeString("en-GB", { timeZone: TZ }); setTimeout(tick, 1000); }
async function times() {
  const { data } = await SB.from("attendance").select("*").eq("admin_id", P.id).order("at", { ascending: false }).limit(20);
  const d = data || [], td = d.filter(r => r.day == today()), inn = td.find(r => r.kind == "in"), out = td.find(r => r.kind == "out");
  const urls = await Promise.all(d.map(r => r.photo_path ? signed(r.photo_path) : ""));
  const sh = S.shot;
  V.innerHTML = back("VAQTLARI") +
    '<div class="glass p c"><div class="m">Bugun</div><div class="clock" id="ck"></div><div class="m">Toshkent vaqti</div></div>' +
    '<div class="glass p" style="margin:14px 0"><b>Davomat holati</b><p class="m">' + (out ? stt(out) : inn ? stt(inn) : "Bugun hali kelganingiz qayd etilmagan.") + '</p></div>' +
    (sh ? '<div class="glass p"><div class="row"><img class="th" src="' + sh.url + '" alt=""><div><b>' + (sh.k == "in" ? "Keldi" : "Ketdi") + '</b><div class="m">Surat tayyor</div></div></div><div class="row2"><button class="btn ghost sm" onclick="shoot(\'' + sh.k + '\')">Qayta olish</button><button class="btn sm" id="snd" onclick="sendShot()">Jo‘natish</button></div></div>'
      : '<div class="row2"><button class="btn ok" ' + (inn ? "disabled" : "") + ' onclick="shoot(\'in\')">Keldi</button><button class="btn" ' + (!inn || out ? "disabled" : "") + ' onclick="shoot(\'out\')">Ketdi</button></div>') +
    '<h3 style="margin:20px 0 10px">Tarix</h3>' +
    (d.map((r, i) => '<div class="glass p row" style="margin-bottom:10px;border-color:var(--' + (r.status == "ok" ? "ok" : "err") + ')">' + (urls[i] ? '<img class="th" src="' + urls[i] + '" alt="">' : "") + '<div style="flex:1"><b>' + (r.kind == "in" ? "Keldi" : "Ketdi") + '</b><div class="m">' + fm(r.at) + '</div></div><span class="pill ' + (r.status == "ok" ? "ok" : "err") + '">' + lab(r) + '</span></div>').join("") || '<div class="glass p c m">Hozircha yozuvlar yo‘q.</div>');
  tick();
}
async function shoot(k) { const f = await pick("user"); if (!f) return; const b = await shrink(f); S.shot = { k, blob: b, url: URL.createObjectURL(b) }; times(); }
async function sendShot() {
  const s = S.shot; $("snd").disabled = true;
  try { const path = await upload(s.blob, P.id); const { error } = await SB.from("attendance").insert({ admin_id: P.id, kind: s.k, photo_path: path }); if (error) throw error; S.shot = null; toast("Yuborildi"); }
  catch (e) { toast(e.message || "Xato"); }
  times();
}

/* ---- GENUBORKA ---- */
async function gen() {
  const { data } = await SB.from("cleaning_photos").select("*").eq("admin_id", P.id).order("taken_at", { ascending: false }).limit(60);
  const d = data || [], u = await Promise.all(d.map(r => signed(r.photo_path))), G = [];
  d.forEach((r, i) => { let g = G.find(x => x.id == r.batch_id); if (!g) { g = { id: r.batch_id, p: [] }; G.push(g); } g.p.push({ u: u[i], t: r.taken_at }); });
  let pend = null; if (G[0] && G[0].p.length < 2) pend = G.shift();
  const cur = G.shift();
  const th = g => '<div class="grid">' + g.p.slice().reverse().map(p => '<div><img class="big" src="' + p.u + '" alt=""><div class="m c">' + fm(p.t) + '</div></div>').join("") + '</div>';
  V.innerHTML = back("GENUBORKA") + '<h3>Oxirgi uborka suratlari</h3>' + (cur ? th(cur) : '<div class="glass p c m" style="margin:10px 0">Hali surat olinmadi.</div>') +
    (pend ? '<p class="m" style="margin-top:12px">Yangi 1/2</p>' + th(pend) : "") +
    '<button class="btn" style="margin:16px 0" onclick="snap()">Suratga olish</button>' + (G.length ? '<h3>Tarix</h3>' + G.map(th).join("") : "");
}
async function snap() {
  const f = await pick("environment"); if (!f) return; toast("Yuklanmoqda…");
  try {
    const b = await shrink(f), path = await upload(b, P.id);
    const { data } = await SB.from("cleaning_photos").select("batch_id").eq("admin_id", P.id).order("taken_at", { ascending: false }).limit(2);
    let bid = crypto.randomUUID();
    if (data && data[0] && (!data[1] || data[1].batch_id != data[0].batch_id)) bid = data[0].batch_id;
    const { error } = await SB.from("cleaning_photos").insert({ admin_id: P.id, batch_id: bid, photo_path: path }); if (error) throw error;
  } catch (e) { toast(e.message || "Xato"); }
  gen();
}

/* ---- OTCHYOT ---- */
async function rep() {
  const { data } = await SB.from("reports").select("*").eq("admin_id", P.id).order("created_at", { ascending: false }).limit(20);
  const hs = S.hist ? await Promise.all((data || []).map(async r => ({ d: r.created_at, u: await Promise.all([r.photo1_path, r.photo2_path].filter(Boolean).map(signed)) }))) : [];
  const slot = i => '<div class="glass p" style="margin-bottom:12px"><b>' + (i + 1) + '-rasm</b><div class="drop" onclick="chose(' + i + ')">' + (S.rep[i] ? '<img class="big" src="' + S.rep[i].url + '" alt="">' : '<span class="m">Rasm tanlang yoki Ctrl+V bosing</span>') + '</div></div>';
  V.innerHTML = '<div class="top"><button class="ib" onclick="go(\'home\')" aria-label="orqaga">‹</button><h2>OTCHYOT</h2><button class="ib" onclick="S.hist=!S.hist;rep()" aria-label="tarix">⟲</button></div>' +
    (S.hist ? '<div class="glass p" style="margin-bottom:14px"><b>Tarix</b>' + (hs.map(h => '<div style="padding:8px 0"><div class="m">' + fm(h.d) + '</div><div class="grid">' + h.u.map(x => '<img class="big" src="' + x + '" alt="">').join("") + '</div></div>').join("") || '<p class="m">Hali otchyot yuborilmagan.</p>') + '</div>' : "") +
    slot(0) + slot(1) + '<button class="btn" id="rs" ' + (S.rep[0] || S.rep[1] ? "" : "disabled") + ' onclick="sendRep()">Jo‘natish</button>';
}
async function setSlot(i, f) { const b = await shrink(f); S.rep[i] = { blob: b, url: URL.createObjectURL(b) }; rep(); }
async function chose(i) { const f = await pick(); if (f) setSlot(i, f); }
document.addEventListener("paste", e => { if (view != "rep") return; const f = [...(e.clipboardData ? e.clipboardData.files : [])].find(x => x.type.startsWith("image/")); if (f) setSlot(S.rep[0] ? 1 : 0, f); });
async function sendRep() {
  $("rs").disabled = true;
  try { const p = await Promise.all(S.rep.map(r => r ? upload(r.blob, P.id) : null)); const { error } = await SB.from("reports").insert({ admin_id: P.id, photo1_path: p[0], photo2_path: p[1] }); if (error) throw error; S.rep = [null, null]; toast("Yuborildi"); }
  catch (e) { toast(e.message || "Xato"); }
  rep();
}

/* ---- XABARLAR ---- */
async function msgs() {
  const { data } = await SB.from("messages").select("*").eq("admin_id", P.id).order("created_at");
  SB.from("messages").update({ read_at: new Date().toISOString() }).eq("admin_id", P.id).neq("sender_id", P.id).is("read_at", null).then(() => {});
  V.innerHTML = back("Xabarlar") + '<div class="glass p" style="min-height:240px;margin-bottom:12px">' +
    ((data || []).map(m => '<div class="b' + (m.sender_id == P.id ? " me" : "") + '">' + esc(m.body) + '<small>' + fm(m.created_at) + '</small></div>').join("") || '<p class="m c">Hali xabar yo‘q.</p>') +
    '</div><div class="row2"><div class="f" style="margin:0"><input id="mi" placeholder="Rahbarga yozing…" onkeydown="if(event.key==\'Enter\')sendMsg()"></div><button class="btn sm" style="flex:none;width:64px" onclick="sendMsg()" aria-label="yuborish">➤</button></div>';
}
async function sendMsg() { const x = $("mi").value.trim(); if (!x) return; const { error } = await SB.from("messages").insert({ admin_id: P.id, sender_id: P.id, body: x }); if (error) toast(error.message); msgs(); }

/* ---- SOZLAMALAR ---- */
function settings() {
  V.innerHTML = back("Sozlamalar") + '<b>Ko‘rinish</b><div class="row2"><button class="btn ghost sm" onclick="theme(\'dark\')">Qorong‘i</button><button class="btn ghost sm" onclick="theme(\'light\')">Yorug‘</button></div>' +
    '<div class="glass p" style="margin-top:12px"><p>' + esc(P.first_name + " " + P.last_name) + ' · ' + esc(P.btp) + '</p><p class="m">Login: ' + esc(P.username) + ' · v1.0</p></div>' +
    '<button class="btn ghost" style="margin-top:16px" onclick="out()">Chiqish</button>';
}
async function out() { await SB.auth.signOut(); P = null; loginView(V, "", boot); }
boot();
</script>
</body>
</html>
